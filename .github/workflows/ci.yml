name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine
        run: python -m pip install -e "engine[dev]"

      - name: Engine tests
        working-directory: engine
        run: python -m pytest -q

      - name: Sidecar tests
        working-directory: desktop/sidecar
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Frontend build
        working-directory: desktop
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # tauri.conf.json bundles the frozen service as a resource; an empty folder is enough for cargo check.
      - name: Placeholder service resource
        shell: bash
        run: mkdir -p desktop/src-tauri/binaries/arabmorph-service

      - name: Cargo check and tests
        working-directory: desktop/src-tauri
        run: |
          cargo check --locked
          cargo check --locked --features updater
          cargo test --locked --lib
