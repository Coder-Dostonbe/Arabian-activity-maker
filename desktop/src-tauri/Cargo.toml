[package]
name = "arabmorph-desktop"
version = "0.5.0"
description = "ArabMorph AI desktop application"
edition = "2021"

[lib]
name = "arabmorph_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native"] }
ureq = "3"
tauri-plugin-updater = { version = "2", optional = true }

[features]
# In-app updates; off until a signing key exists (see desktop/README.md, "Updates").
updater = ["dep:tauri-plugin-updater"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
