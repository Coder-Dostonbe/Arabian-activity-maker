[package]
name = "arabmorph-desktop"
version = "0.3.0"
description = "ArabMorph AI desktop application"
edition = "2021"

[lib]
name = "arabmorph_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
